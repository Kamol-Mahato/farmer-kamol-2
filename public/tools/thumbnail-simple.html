<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>সহজ থাম্বনেইল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atma:wght@700&family=Baloo+Da+2:wght@800&family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font:500 14px "Hind Siliguri",sans-serif;background:#e9eee9;color:#1c2a22;display:flex;min-height:100vh}
aside{width:370px;max-width:100%;background:#fff;padding:14px 16px 40px;overflow-y:auto;height:100vh;position:sticky;top:0;border-right:1px solid #cfd8d1}
h1{font-size:18px;margin:0 0 10px;color:#0b6b3c}
h2{font-size:13px;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid #f2b705}
label{display:block;margin:7px 0 2px;font-size:12px;color:#44574b}
input[type=text],textarea,select{width:100%;padding:7px 8px;border:1px solid #b9c6bc;border-radius:6px;font:inherit;background:#fbfdfb}
textarea{resize:vertical}
input[type=color]{width:100%;height:32px;border:1px solid #b9c6bc;border-radius:6px;padding:2px}
input[type=range]{width:100%;margin:0}
.row{display:flex;gap:8px}.row>*{flex:1}
.chk{display:flex;gap:6px;align-items:center;margin:8px 0 0;font-size:13px;color:#1c2a22}
.img{border:1px solid #cfd8d1;border-radius:8px;padding:8px;margin:8px 0;background:#f6f9f6}
.img b{font-size:12px}
.img .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px;font-size:11px;color:#5a6c60}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:8px 12px;background:#0b6b3c;color:#fff}
button.g{background:#e3ebe5;color:#1c2a22}
button.x{background:#c8102e;padding:2px 8px;float:right}
main{flex:1;padding:16px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;justify-content:center}
figure{margin:0}
figcaption{font-size:12px;margin-bottom:4px;color:#44574b}
canvas{background:#ccc;box-shadow:0 2px 10px rgba(0,0,0,.25);display:block}
#cL{width:min(760px,100%)}
#cP{height:560px}
.hint{font-size:11px;color:#6a7b70;margin:3px 0 0}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;position:static}}

.ly{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid #cfd8d1;border-radius:6px;margin:3px 0;font-size:12px;cursor:pointer;background:#f6f9f6}
.ly.on{border-color:#00a2ff;background:#e6f4ff}.ly .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.ly b{cursor:pointer;padding:0 4px;font-weight:400}
canvas{touch-action:none}#props{margin-top:8px;padding:8px;border:1px dashed #b9c6bc;border-radius:8px}#msg{font-size:11px;color:#5a6c60}
</style>
</head>
<body>
<aside>
<h1>সহজ থাম্বনেইল</h1>
<div class="row"><button id="dlBoth">⬇ দুটোই</button><button class="g" id="dlL">১৬:৯</button><button class="g" id="dlP">৯:১৬</button></div>
<div class="row" style="margin-top:6px"><select id="sFmt"><option value="jpg">JPG (ছোট ফাইল)</option><option value="png">PNG</option></select><button class="g" id="undo">↶</button><button class="g" id="redo">↷</button><button class="g" id="reset">রিসেট</button></div>
<div id="msg"></div>
<h2>যোগ ও টেমপ্লেট</h2>
<div class="row"><label class="g" style="margin:0"><input type="file" id="addImg" accept="image/*" multiple style="display:none"><button class="g" style="width:100%" onclick="this.previousElementSibling.click()">+ ছবি</button></label><button class="g" id="addTxt">+ লেখা</button></div>
<div class="row" style="margin-top:6px"><select id="tplSel"><option value="split">লেখা একপাশে, ছবি অন্যপাশে</option><option value="full">ছবি পুরো জুড়ে</option><option value="ghost">হালকা বড় লেখা ছবির আড়ালে</option></select><button class="g" id="tplGo">সাজান</button></div>
<h2>স্তর</h2><div id="layers"></div><div id="props"></div>
<h2>স্টাইল</h2>
<div class="row"><div><label>ফন্ট</label><select id="sFont"><option value="baloo">মোটা গোলাকার</option><option value="atma">হাতে লেখা ধাঁচ</option><option value="hind">সোজা মোটা</option></select></div></div>
<div class="row"><div><label>ব্যাকগ্রাউন্ড ১</label><input type="color" id="cBg1"></div><div><label>ব্যাকগ্রাউন্ড ২</label><input type="color" id="cBg2"></div></div>
<label class="chk"><input type="checkbox" id="cGrad"> গ্রেডিয়েন্ট</label>
<label class="chk"><input type="checkbox" id="cSafe"> নিরাপদ এলাকার দাগ (ডাউনলোডে আসবে না)</label>
<h2>প্রোফাইল (লোগো ও ফুটার)</h2>
<label>প্রোফাইল</label><select id="pSel"></select>
<div class="row" style="margin-top:6px"><button class="g" id="pNew">+ নতুন</button><button class="g" id="pDel">মুছুন</button></div>
<label>নাম (লোগোর পাশে)</label><input type="text" id="pBrand">
<label>লোগো</label><input type="file" id="pLogo" accept="image/*">
<label>ওয়েবসাইট</label><input type="text" id="pWeb">
<label>ফেসবুক</label><input type="text" id="pFb">
<label>ইউটিউব</label><input type="text" id="pYt">
<label>ইনস্টাগ্রাম</label><input type="text" id="pIg">
<label>ফুটারের রং</label><input type="color" id="pAccent">
<p class="hint">প্রোফাইলের সব বদল নিজে নিজে সেভ হয়। খালি ঘর ফুটারে আসে না।</p>
</aside>
<main>
<figure><figcaption>১৬:৯ (১২৮০×৭২০)</figcaption><canvas id="cL" width="1280" height="720"></canvas></figure>
<figure><figcaption>৯:১৬ (১০৮০×১৯২০)</figcaption><canvas id="cP" width="1080" height="1920"></canvas></figure>
</main>
<script>
/*DRAW*/
const FONTS={baloo:'800 {s}px "Baloo Da 2"',atma:'700 {s}px Atma',hind:'700 {s}px "Hind Siliguri"'};
const DEFP={brand:"Farmer Kamol",web:"farmerkamol.com",fb:"Farmer Kamol",yt:"Farmer Kamol",ig:"",accent:"#0b6b3c",logo:"/icons/icon-512.png"};
function ld(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v||d}catch(e){return d}}
const P=ld("fk_thumb_profiles",{cur:"Farmer Kamol",list:{"Farmer Kamol":DEFP}});
const cur=()=>P.list[P.cur]||(P.cur=Object.keys(P.list)[0],P.list[P.cur]);
const SS=Object.assign({font:"baloo",bg1:"#0f4d2e",bg2:"#073018",grad:false,safe:false,fmt:"jpg"},ld("fk_thumb2_ss",{}));
const DIM={L:[1280,720],P:[1080,1920]},CORE=["p0","p1","p2","p3","title","sub","seal","logo","brand","footer"];
const IM={};let LG=null,D=null,sel=null,act="L",hist=[],hi=-1,pan=null,guide=null,drag=null,TOUCH=false;const SC={L:1,P:1};
const F=s=>FONTS[SS.font].replace("{s}",Math.round(s));
const seg=t=>(window.Intl&&Intl.Segmenter)?[...new Intl.Segmenter("bn",{granularity:"grapheme"}).segment(t)].map(x=>x.segment):Array.from(t);
const MC=(typeof document!=="undefined"?document.createElement("canvas"):{getContext:()=>null}).getContext("2d");
function rr(c,x,y,w,h,r){c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function marker(c,x0,y,w,s){c.save();c.strokeStyle="rgba(242,183,5,.92)";c.lineWidth=s*.2;c.lineCap="round";c.lineJoin="round";c.beginPath();c.moveTo(x0,y+s*.04);for(let k=1;k<=8;k++)c.lineTo(x0+w*k/8,y+s*.04+(k%2?1:-1)*s*.03);c.stroke();c.restore()}

function arrange(n,R,g){const{x,y,w,h}=R;if(n<=1)return[R];const land=w>=h;
  if(n===2)return land?[{x,y,w:(w-g)/2,h},{x:x+(w+g)/2,y,w:(w-g)/2,h}]:[{x,y,w,h:(h-g)/2},{x,y:y+(h+g)/2,w,h:(h-g)/2}];
  if(n===3){if(land){const a=(w-g)*.58,b=w-g-a;return[{x,y,w:a,h},{x:x+a+g,y,w:b,h:(h-g)/2},{x:x+a+g,y:y+(h+g)/2,w:b,h:(h-g)/2}]}
    const a=(h-g)*.58,b=h-g-a;return[{x,y,w,h:a},{x,y:y+a+g,w:(w-g)/2,h:b},{x:x+(w+g)/2,y:y+a+g,w:(w-g)/2,h:b}]}
  const cw=(w-g)/2,ch=(h-g)/2;return[{x,y,w:cw,h:ch},{x:x+cw+g,y,w:cw,h:ch},{x,y:y+ch+g,w:cw,h:ch},{x:x+cw+g,y:y+ch+g,w:cw,h:ch}]}

function torn(c,x,y,w,h,u,sd){const st=18*u;let k=0;const j=()=>{k++;return(((Math.sin(k*12.9898+sd*78.233)*43758.5453)%1+1)%1)*6*u-3*u};
  c.moveTo(x,y);for(let t=st;t<w;t+=st)c.lineTo(x+t,y+j());c.lineTo(x+w,y);
  for(let t=st;t<h;t+=st)c.lineTo(x+w+j(),y+t);c.lineTo(x+w,y+h);
  for(let t=st;t<w;t+=st)c.lineTo(x+w-t,y+h+j());c.lineTo(x,y+h);
  for(let t=st;t<h;t+=st)c.lineTo(x+j(),y+h-t);c.closePath()}

function curved(c,t,rad,s){c.font=F(s);c.textBaseline="middle";c.textAlign="center";
  const ch=seg(t),ws=ch.map(x=>c.measureText(x).width);let tot=ws.reduce((a,b)=>a+b,0)/rad;
  if(tot>2.6){s*=2.6/tot;c.font=F(s);ws.forEach((_,i)=>ws[i]=c.measureText(ch[i]).width);tot=ws.reduce((a,b)=>a+b,0)/rad}
  let a=-Math.PI/2-tot/2;
  ch.forEach((x,i)=>{const h=ws[i]/rad/2;a+=h;c.save();c.rotate(a+Math.PI/2);c.fillText(x,0,-rad);c.restore();a+=h})}

function seal(c,it,r){const u=1,cx=0,cy=0;
  if(!it.seal&&!it.center)return;
  c.save();c.translate(cx,cy);
  c.shadowColor="rgba(0,0,0,.35)";c.shadowBlur=14*u;c.shadowOffsetY=6*u;
  c.fillStyle="#c8102e";c.beginPath();c.arc(0,0,r,0,7);c.fill();c.shadowColor="transparent";
  c.strokeStyle="#f2b705";c.lineWidth=r*.07;c.beginPath();c.arc(0,0,r*.88,0,7);c.stroke();
  c.fillStyle="#fff";
  const mid=(t,s)=>{c.font=F(s);const m=c.measureText(t).width;if(m>r*1.5)s*=r*1.5/m;c.font=F(s);c.textAlign="center";c.textBaseline="middle"};
  if(it.seal&&it.center){curved(c,it.seal,r*.62,r*.27);mid(it.center,r*.5);c.fillText(it.center,0,r*.18)}
  else{const t=it.seal||it.center;mid(t,r*.6);c.fillText(t,0,0)}
  c.restore()}

function icon(c,k,x,y,s,ac){c.save();c.translate(x,y);c.lineWidth=s*.09;c.strokeStyle=c.fillStyle="#fff";
  if(k==="web"){c.beginPath();c.arc(s/2,s/2,s/2-1,0,7);c.stroke();c.beginPath();c.ellipse(s/2,s/2,s*.2,s/2-1,0,0,7);c.stroke();c.beginPath();c.moveTo(1,s/2);c.lineTo(s-1,s/2);c.stroke()}
  else if(k==="fb"){c.beginPath();c.arc(s/2,s/2,s/2,0,7);c.fill();c.fillStyle=ac;c.font="700 "+s*.9+"px Arial";c.textAlign="center";c.textBaseline="middle";c.fillText("f",s*.55,s*.56)}
  else if(k==="yt"){c.fillStyle="#ff0000";c.beginPath();rr(c,0,s*.12,s*1.1,s*.76,s*.2);c.fill();c.fillStyle="#fff";c.beginPath();c.moveTo(s*.42,s*.3);c.lineTo(s*.42,s*.7);c.lineTo(s*.76,s*.5);c.fill()}
  else{c.beginPath();rr(c,1,1,s-2,s-2,s*.28);c.stroke();c.beginPath();c.arc(s/2,s/2,s*.22,0,7);c.stroke();c.beginPath();c.arc(s*.74,s*.26,s*.05,0,7);c.fill()}
  c.restore()}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mk=(id,t,o)=>Object.assign({id,t,x:0,y:0,w:100,h:100,rot:0,lock:false,hide:false},o);
const BASE=()=>[
  mk("p0","photo",{frame:"round",z:1,px:0,py:0}),mk("p1","photo",{frame:"round",z:1,px:0,py:0,hide:true}),mk("p2","photo",{frame:"round",z:1,px:0,py:0,hide:true}),mk("p3","photo",{frame:"round",z:1,px:0,py:0,hide:true}),
  mk("title","text",{text:"শুরু করলাম\nআমাদের খামার",size:100,color:"#ffffff",stroke:1,curve:0,marker:true}),
  mk("sub","text",{text:"বাস্তব কাজের ভিত্তিতে",size:56,color:"#f2b705",stroke:1,curve:0,marker:false}),
  mk("seal","seal",{seal:"খাঁটি",center:"৳৮৫০",hide:true}),
  mk("logo","logo",{}),mk("brand","text",{bind:"brand",text:"",size:36,color:"#ffffff",stroke:1,curve:0}),
  mk("footer","footer",{style:"bar",stripe:false})];
function tw(it){MC.font=F(it.size);const t=it.bind==="brand"?cur().brand:it.text;return Math.max(10,...(t||"").split("\n").map(l=>MC.measureText(l).width))}
function fitSize(t,w,h,mx){const L=t.split("\n");for(let s=mx;s>=14;s-=3){MC.font=F(s);if(L.every(l=>MC.measureText(l).width<=w)&&L.length*s*1.2<=h)return s}return 14}
const ROT=[-2.2,1.8,-1.5,2.4];
function layout(nm){
  for(const k of["L","P"]){
    const[W,H]=DIM[k],land=k==="L",pad=land?44:56,fh=land?60:74,fy=land?H-fh:H-300-fh,bot=fy-18,top=land?150:214,Cw=W-2*pad,Ch=bot-top;
    const I=id=>D[k].find(i=>i.id===id),set=(it,r)=>{if(!it)return;it.x=r.x+r.w/2;it.y=r.y+r.h/2;it.w=r.w;it.h=r.h;it.rot=0};
    const tx=(id,r,mx)=>{const it=I(id);if(!it)return;it.x=r.x+r.w/2;it.y=r.y+r.h/2;it.rot=0;it.size=fitSize(it.text,r.w,r.h,mx);it.a=1};
    const idx=[0,1,2,3].filter(i=>IM["p"+i]);if(!idx.length)idx.push(0);
    [0,1,2,3].forEach(i=>{const it=I("p"+i);it.hide=!idx.includes(i)});
    const cards=(R,list)=>arrange(list.length,R,16).forEach((r,j)=>{const it=I("p"+list[j]);set(it,r);it.rot=(list.length>1&&it.frame!=="circle")?ROT[j]:0});
    if(nm==="full"){const a=I("p"+idx[0]);set(a,{x:0,y:0,w:W,h:H});a.frame="rect";const rest=idx.slice(1);
      if(rest.length)cards(land?{x:W-pad-Cw*.2,y:top,w:Cw*.2,h:Ch}:{x:pad,y:bot-Ch*.22,w:Cw,h:Ch*.22},rest);
      tx("title",land?{x:pad,y:top,w:Cw*.5,h:Ch*.6}:{x:pad,y:top,w:Cw,h:Ch*.26},150);tx("sub",land?{x:pad,y:top+Ch*.65,w:Cw*.5,h:Ch*.3}:{x:pad,y:top+Ch*.27,w:Cw,h:Ch*.1},64)}
    else{[0,1,2,3].forEach(i=>{const it=I("p"+i);if(it.frame==="rect"&&it.w>=W)it.frame="round"});
      if(nm==="ghost"){tx("title",{x:W*.03,y:top,w:W*.94,h:Ch*.66},420);I("title").a=.22;cards(land?{x:W*.18,y:top+Ch*.08,w:W*.64,h:Ch*.7}:{x:pad,y:top+Ch*.14,w:Cw,h:Ch*.56},idx);tx("sub",{x:pad,y:top+Ch*.8,w:Cw,h:Ch*.2},110)}
      else{cards(land?{x:pad+Cw*.5,y:top,w:Cw*.5,h:Ch}:{x:pad,y:top,w:Cw,h:Ch*.52},idx);
        tx("title",land?{x:pad,y:top,w:Cw*.46,h:Ch*.62}:{x:pad,y:top+Ch*.56,w:Cw,h:Ch*.28},170);tx("sub",land?{x:pad,y:top+Ch*.66,w:Cw*.46,h:Ch*.3}:{x:pad,y:top+Ch*.86,w:Cw,h:Ch*.14},70)}}
    const s=land?72:84,lg=I("logo");lg.x=W-pad-s/2;lg.y=land?80:126;lg.w=lg.h=s;lg.rot=0;
    const se=I("seal");se.w=se.h=(land?62:80)*2;se.x=pad+se.w/2;se.y=lg.y;se.rot=0;
    const br=I("brand");br.size=land?36:40;br.rot=0;br.hide=false;br.x=lg.x-s/2-14-tw(br)/2;br.y=lg.y;
    const ft=I("footer");ft.x=W/2;ft.y=fy+fh/2;ft.w=land?W:W-2*pad;ft.h=fh;ft.rot=0;ft.style=land?"bar":"pill";
    const ORD=nm==="ghost"?["title","p0","p1","p2","p3","sub","seal","logo","brand","footer"]:["p0","p1","p2","p3","title","sub","seal","logo","brand","footer"];
    D[k].sort((a,b)=>{const x=ORD.indexOf(a.id),y=ORD.indexOf(b.id);return(x<0?99:x)-(y<0?99:y)});
  }}
function arc(c,t,R,y,up,sw){const ch=seg(t),ws=ch.map(x=>c.measureText(x).width),tot=ws.reduce((a,b)=>a+b,0)/R;let a=-tot/2;
  ch.forEach((x,i)=>{const h=ws[i]/R/2;a+=h;c.save();if(up){c.translate(0,y+R);c.rotate(a);c.translate(0,-R)}else{c.translate(0,y-R);c.rotate(-a);c.translate(0,R)}
    if(sw)c.strokeText(x,0,0);else c.fillText(x,0,0);c.restore();a+=h})}
function textDraw(c,it){
  const s=it.size,t=it.bind==="brand"?cur().brand:it.text,L=(t||"").split("\n"),lh=s*1.2;
  c.font=F(s);const ws=L.map(l=>c.measureText(l).width);it._w=Math.max(10,...ws);it._h=L.length*lh;
  const cv=(it.curve||0)/100,R=cv?Math.max(it._w,s*2)/(Math.abs(cv)*1.6):0;
  c.globalAlpha=it.a==null?1:it.a;c.textAlign="center";c.textBaseline="middle";c.lineJoin="round";
  L.forEach((l,i)=>{const y=-it._h/2+lh*(i+.5);
    if(it.marker&&i===L.length-1&&!cv)marker(c,-ws[i]/2,y+s*.4,ws[i],s);
    if(it.stroke>0){c.strokeStyle="#000";c.lineWidth=s*.14*it.stroke;if(cv)arc(c,l,R,y,cv>0,1);else c.strokeText(l,0,y)}
    c.fillStyle=it.color;if(cv)arc(c,l,R,y,cv>0,0);else c.fillText(l,0,y)});
  c.globalAlpha=1}
function cover(c,it,x,y,w,h){const im=IM[it.id];
  if(!im){c.fillStyle="#c9c3b3";c.fillRect(x,y,w,h);c.fillStyle="#7a7466";c.font=F(Math.min(w,h)*.12);c.textAlign="center";c.textBaseline="middle";c.fillText("ছবি",x+w/2,y+h/2);return}
  const a=im.naturalWidth||im.width,b=im.naturalHeight||im.height,sc=Math.max(w/a,h/b)*(it.z||1),dw=a*sc,dh=b*sc;it._ov=[(dw-w)/2,(dh-h)/2];
  c.drawImage(im,x+w/2+(it.px||0)/100*it._ov[0]-dw/2,y+h/2+(it.py||0)/100*it._ov[1]-dh/2,dw,dh)}
function photoDraw(c,it){let w=it.w,h=it.h,pad=0,bot=0;const fr=it.frame;
  if(fr==="polaroid"){pad=12;bot=40}if(fr==="circle")w=h=Math.min(w,h);
  c.shadowColor="rgba(0,0,0,.4)";c.shadowBlur=20;c.shadowOffsetY=8;
  if(fr==="polaroid"){c.fillStyle="#fff";c.fillRect(-w/2,-h/2,w,h);c.shadowColor="transparent"}
  const ix=-w/2+pad,iy=-h/2+pad,iw=w-2*pad,ih=h-2*pad-bot;c.beginPath();

$("dlL").onclick=()=>exp("L");$("dlP").onclick=()=>exp("P");$("dlBoth").onclick=async()=>{await exp("L");await exp("P")};
